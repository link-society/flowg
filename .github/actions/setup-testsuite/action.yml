---
name: Setup FlowG test suite
description: Installs PDM, Hurl and project dependencies
inputs:
  ref:
    description: Git reference (commit, branch or tag)
    required: true
runs:
  using: composite
  steps:
    - name: setup@pdm
      uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0
      with:
        python-version: "3.13"

    - name: setup@rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: stable
        cache: false
        rustflags: ""

    - name: setup@sys-deps
      shell: bash
      run: |
        sudo -n apt-get update
        sudo -n apt-get install -y build-essential pkg-config libssl-dev libcurl4-openssl-dev libxml2-dev libclang-dev

    - name: setup@hurl
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        HURL_VERSION: "8.1.0"
      run: |
        cargo install --locked --version "$HURL_VERSION" hurl
        hurl --version

    - name: setup@env
      shell: bash
      working-directory: ./tests
      run: pdm install

    - name: download@image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docker-image-${{ inputs.ref }}-linux-amd64

    - name: load@image
      shell: bash
      run: docker load -i image.tar
