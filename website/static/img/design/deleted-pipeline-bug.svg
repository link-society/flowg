<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="The delete bug: the pipeline is gone from storage but its compiled version stays in the cache and keeps processing records">
  <rect x="0" y="0" width="760" height="240" rx="10" fill="#ffffff"/>
  <rect x="6" y="4" width="748" height="232" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="18" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">delete didn't stop anything</text>

  <!-- storage -->
  <rect x="40" y="60" width="250" height="110" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M40,66 a6,6 0 0 1 6,-6 h238 a6,6 0 0 1 6,6 v20 h-250 z" fill="#1e40af"/>
  <text x="165" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">CONFIG STORAGE</text>
  <text x="60" y="112" font-family="monospace" font-size="12" fill="#1e293b">pipeline : ingress</text>
  <text x="60" y="140" font-family="monospace" font-size="12" fill="#94a3b8" text-decoration="line-through">pipeline : audit</text>
  <text x="220" y="140" font-family="sans-serif" font-size="11" fill="#b45309">deleted</text>

  <!-- cache -->
  <rect x="440" y="60" width="280" height="110" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M440,66 a6,6 0 0 1 6,-6 h268 a6,6 0 0 1 6,6 v20 h-280 z" fill="#1e40af"/>
  <text x="580" y="75" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">PIPELINE CACHE</text>
  <text x="460" y="112" font-family="monospace" font-size="12" fill="#1e293b">ingress (compiled)</text>
  <text x="460" y="140" font-family="monospace" font-size="12" fill="#b45309">audit (compiled)</text>
  <text x="622" y="140" font-family="sans-serif" font-size="11" fill="#b45309">still there</text>

  <!-- no invalidation -->
  <path d="M290,115 L440,115" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="365" y="108" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">✕</text>
  <text x="365" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">no invalidation on delete</text>

  <!-- records still flowing -->
  <path d="M700,40 C680,70 640,110 610,132" fill="none" stroke="#b45309" stroke-width="1.4"/>
  <path d="M610,132 l9,-2 l-4,-8 z" fill="#b45309"/>
  <text x="660" y="46" font-family="sans-serif" font-size="10" fill="#b45309">records</text>

  <text x="380" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">the "deleted" pipeline keeps processing records until the next restart</text>
</svg>
