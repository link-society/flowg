<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="The old model: services, engines and storages on one node; the API saves configuration and directly invalidates the pipeline cache">
  <rect x="0" y="0" width="760" height="520" rx="10" fill="#ffffff"/>
  <rect x="6" y="4" width="748" height="512" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="18" y="22" font-family="sans-serif" font-size="11" font-weight="bold" fill="#94a3b8">the old model, on one node</text>

  <!-- services -->
  <text x="36" y="56" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">SERVICES</text>
  <rect x="44" y="66" width="150" height="54" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="119" y="89" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">syslog server</text>
  <text x="119" y="107" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">udp / tcp / tls</text>
  <rect x="240" y="66" width="190" height="54" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="335" y="89" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">HTTP server</text>
  <text x="335" y="107" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">REST API + web UI</text>
  <rect x="476" y="66" width="170" height="54" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="561" y="89" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">management server</text>
  <text x="561" y="107" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">health + metrics</text>

  <!-- engines -->
  <text x="36" y="186" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">ENGINES</text>
  <rect x="44" y="196" width="230" height="64" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="159" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">pipeline engine</text>
  <text x="159" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">cache of compiled pipelines</text>
  <rect x="476" y="196" width="170" height="64" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="561" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">log notifier</text>
  <text x="561" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">live tail for the UI</text>

  <!-- storages -->
  <text x="36" y="316" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">STORAGES</text>
  <rect x="44" y="326" width="140" height="60" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="114" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">log storage</text>
  <text x="114" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">streams + indexes</text>
  <rect x="220" y="326" width="200" height="60" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">config storage</text>
  <text x="320" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">pipelines, transformers, forwarders</text>
  <rect x="456" y="326" width="140" height="60" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="526" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">auth storage</text>
  <text x="526" y="368" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">users, roles, tokens</text>

  <!-- database -->
  <rect x="20" y="416" width="720" height="88" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="436" font-family="sans-serif" font-size="10" font-weight="bold" fill="#94a3b8">BADGERDB, OR FOUNDATIONDB IN CLUSTER MODE</text>
  <rect x="44" y="446" width="140" height="44" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="114" y="472" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">log namespace</text>
  <rect x="220" y="446" width="200" height="44" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="320" y="472" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">config namespace</text>
  <rect x="456" y="446" width="140" height="44" rx="6" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="526" y="472" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">auth namespace</text>

  <!-- arrows -->
  <path d="M119,120 L129,196" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M129,196 l-6,-7 l7,-2 z" fill="#94a3b8"/>
  <text x="98" y="160" font-family="sans-serif" font-size="10" fill="#64748b">records</text>

  <path d="M290,120 L210,196" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M210,196 l9,-2 l-5,-7 z" fill="#94a3b8"/>
  <text x="258" y="164" font-family="sans-serif" font-size="10" fill="#64748b">records</text>

  <path d="M340,120 L324,326" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <path d="M324,326 l-3,-9 l8,0 z" fill="#b45309"/>
  <circle cx="333" cy="170" r="9" fill="#b45309"/>
  <text x="333" y="174" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1</text>
  <text x="345" y="174" font-family="sans-serif" font-size="10" fill="#b45309">save pipeline</text>

  <path d="M385,120 C400,170 320,200 274,214" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6,4"/>
  <path d="M274,214 l9,2 l-2,-8 z" fill="#b45309"/>
  <circle cx="382" cy="165" r="9" fill="#b45309"/>
  <text x="382" y="169" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <text x="394" y="169" font-family="sans-serif" font-size="10" fill="#b45309">invalidate cache</text>

  <path d="M130,260 L116,326" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M116,326 l-2,-9 l8,1 z" fill="#94a3b8"/>
  <text x="80" y="296" font-family="sans-serif" font-size="10" fill="#64748b">store</text>

  <path d="M220,260 L280,326" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M280,326 l-2,-9 l-6,5 z" fill="#94a3b8"/>
  <text x="240" y="300" font-family="sans-serif" font-size="10" fill="#64748b">compile on first use</text>

  <path d="M114,386 L114,446" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M114,446 l-4,-8 h8 z" fill="#94a3b8"/>
  <path d="M320,386 L320,446" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M320,446 l-4,-8 h8 z" fill="#94a3b8"/>
  <path d="M526,386 L526,446" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M526,446 l-4,-8 h8 z" fill="#94a3b8"/>
</svg>
